// ==================== КУРС PYTHON ====================
const course = [

      {

        title: "Что такое Python?",
        theory: `
          <h2>Добро пожаловать в PyCamp!</h2>
          <p>Python — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Он известен своей простотой и читаемостью кода.</p>
          <h3>Почему Python популярен?</h3>
          <ul>
            <li><strong>Простой синтаксис</strong> — код читается почти как английский текст</li>
            <li><strong>Универсальность</strong> — веб-разработка, наука о данных, ИИ, автоматизация</li>
            <li><strong>Огромное сообщество</strong> — тысячи библиотек и ресурсов</li>
            <li><strong>Востребованность</strong> — одна из самых популярных профессий в IT</li>
          </ul>
          <h3>Ваша первая программа</h3>
          <p>Традиционно изучение любого языка начинается с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
          <pre><code>print("Hello, World!")</code></pre>
          <p>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки — это называется <em>строкой</em>.</p>
          <h3>Задание</h3>
          <p>Выведите на экран фразу <code>Hello, World!</code></p>
        `,
        initialCode: `# Выведите "Hello, World!"\n`,
        tests: [
          { text: 'Код должен выводить "Hello, World!"', check: (output) => output.includes('Hello, World!') }
        ]
      },
      {
        id: "1-2",
        title: "Комментарии",
        theory: `
          <h2>Комментарии в Python</h2>
          <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают другим разработчикам (и вам самим в будущем) понять логику программы.</p>
          <h3>Однострочные комментарии</h3>
          <p>Начинаются с символа <code>#</code>:</p>
          <pre><code># Это комментарий
print("Привет")  # Это тоже комментарий</code></pre>
          <h3>Многострочные комментарии</h3>
          <p>Используются тройные кавычки (обычно для документации):</p>
          <pre><code>"""
Это многострочный
комментарий
"""</code></pre>
          <h3>Задание</h3>
          <p>Добавьте комментарий <code># Мой первый комментарий</code> и выведите <code>Python</code></p>
        `,
        initialCode: `# Добавьте комментарий здесь\n\n# Выведите "Python"\n`,
        tests: [
          { text: 'Код содержит комментарий "# Мой первый комментарий"', check: (output, code) => code.includes('# Мой первый комментарий') },
          { text: 'Код выводит "Python"', check: (output) => output.includes('Python') }
        ]
      },
      {
        id: "1-3",
        title: "Функция print()",
        theory: `
          <h2>Функция print()</h2>
          <p>Функция <code>print()</code> — основная функция для вывода информации. Она может принимать несколько аргументов:</p>
          <pre><code>print("Привет")
print("Привет", "Мир")
print("Число:", 42)</code></pre>
          <h3>Перенос строки</h3>
          <p>Каждый вызов <code>print()</code> по умолчанию добавляет перенос строки. Это можно изменить параметром <code>end</code>:</p>
          <pre><code>print("Привет", end=" ")
print("Мир")  # Выведет: Привет Мир</code></pre>
          <h3>Специальные символы</h3>
          <ul>
            <li><code>\\n</code> — перенос строки</li>
            <li><code>\\t</code> — табуляция</li>
            <li><code>\\\\</code> — обратный слеш</li>
          </ul>
          <pre><code>print("Первая строка\\nВторая строка")
print("Имя:\\tАнна")</code></pre>
          <h3>Задание</h3>
          <p>Выведите три строки: <code>Python</code>, <code>это</code>, <code>круто!</code> — каждую с новой строки.</p>
        `,
        initialCode: `# Выведите три слова\n`,
        tests: [
          { text: 'Вывод содержит "Python"', check: (output) => output.includes('Python') },
          { text: 'Вывод содержит "это"', check: (output) => output.includes('это') },
          { text: 'Вывод содержит "круто!"', check: (output) => output.includes('круто!') }
        ]
      }
    ]
  },
  {
    id: 2,
    title: "Переменные и типы данных",
    lessons: [
      {
        id: "2-1",
        title: "Переменные",
        theory: `
          <h2>Переменные в Python</h2>
          <p>Переменная — это именованная область памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
          <pre><code>name = "Анна"
age = 25
height = 1.68
is_student = True</code></pre>
          <h3>Правила именования</h3>
          <ul>
            <li>Могут содержать буквы, цифры и символ <code>_</code></li>
            <li>Не могут начинаться с цифры</li>
            <li>Регистр имеет значение: <code>name</code> и <code>Name</code> — разные переменные</li>
            <li>Нельзя использовать ключевые слова Python (<code>if</code>, <code>for</code>, <code>class</code> и др.)</li>
          </ul>
          <h3>Стиль именования</h3>
          <p>В Python принято использовать <code>snake_case</code> для переменных:</p>
          <pre><code>user_name = "Иван"  # Хорошо

          <p>Создайте переменные <code>name</code> со значением <code>"Python"</code> и <code>version</code> со значением <code>3</code>. Выведите их через пробел.</p>
        `,
        initialCode: `# Создайте переменные name и version\n\n# Выведите их\n`,
        tests: [
          { text: 'Переменная name равна "Python"', check: (output, code) => /name\s*=\s*["']Python["']/.test(code) },
          { text: 'Переменная version равна 3', check: (output, code) => /version\s*=\s*3/.test(code) },
          { text: 'Вывод содержит "Python 3"', check: (output) => output.includes('Python 3') || output.includes('Python3') }
        ]
      },
      {
        id: "2-2",
        title: "Числа",
        theory: `
          <h2>Числовые типы данных</h2>
          <p>В Python есть два основных числовых типа:</p>
          <ul>
            <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
            <li><code>float</code> — числа с плавающей точкой: <code>3.14</code>, <code>-0.5</code></li>
          </ul>
          <h3>Арифметические операции</h3>
          <pre><code>a = 10
b = 3

print(a + b)   # 13 — сложение
print(a - b)   # 7  — вычитание
print(a * b)   # 30 — умножение
print(a / b)   # 3.333... — деление
print(a // b)  # 3  — целочисленное деление
print(a % b)   # 1  — остаток от деления
print(a ** b)  # 1000 — возведение в степень</code></pre>
          <h3>Приоритет операций</h3>
          <p>Как в математике: сначала <code>**</code>, потом <code>* / // %</code>, затем <code>+ -</code>. Скобки меняют приоритет:</p>
          <pre><code>print(2 + 3 * 4)    # 14
print((2 + 3) * 4)  # 20</code></pre>
          <h3>Задание</h3>
          <p>Вычислите и выведите результат: <code>17</code> в степени <code>2</code>.</p>
        `,
        initialCode: `# Вычислите 17 в степени 2 и выведите результат\n`,
        tests: [
          { text: 'Результат равен 289', check: (output) => output.includes('289') }
        ]
      },
      {
        id: "2-3",
        title: "Строки",
        theory: `
          <h2>Строки (str)</h2>
          <p>Строка — это последовательность символов. Создаётся с помощью кавычек:</p>
          <pre><code>s1 = "Привет"
s2 = 'Мир'
s3 = """Многострочная
строка"""</code></pre>
          <h3>Операции со строками</h3>
          <pre><code># Конкатенация (сложение)
print("Привет" + " " + "Мир")  # Привет Мир

# Повторение
print("Ха" * 3)  # ХаХаХа

# Длина строки
print(len("Python"))  # 6</code></pre>
          <h3>Индексация и срезы</h3>
          <pre><code>s = "Python"
print(s[0])     # P (первый символ)
print(s[-1])    # n (последний)
print(s[0:3])   # Pyt (срез с 0 по 2)
print(s[::2])   # Pto (каждый второй)</code></pre>
          <h3>Задание</h3>
          <p>Создайте строку <code>"Python"</code> и выведите её длину.</p>
        `,
        initialCode: `# Создайте строку "Python" и выведите её длину\n`,
        tests: [
          { text: 'Результат равен 6', check: (output) => output.includes('6') }

          <h2>Форматирование строк</h2>

          <p>Современный и самый удобный способ (Python 3.6+):</p>
          <pre><code>name = "Анна"
age = 25
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
          <h3>Метод format()</h3>
          <pre><code>print("Меня зовут {}, мне {} лет".format(name, age))
print("Меня зовут {0}, мне {0} лет".format(name))</code></pre>

          <pre><code>print("Меня зовут " + name + ", мне " + str(age) + " лет")</code></pre>

          <pre><code>pi = 3.14159265
print(f"Число Пи: {pi:.2f}")  # 3.14
print(f"Процент: {0.75:.0%}")  # 75%</code></pre>
          <h3>Задание</h3>
          <p>Создайте переменные <code>fruit = "яблоко"</code> и <code>count = 5</code>. Выведите: <code>У меня 5 яблоко</code> используя f-строку.</p>
        `,
        initialCode: `# Создайте переменные и используйте f-строку\n`,

          <h3>Операции сравнения</h3>

    def complete_task(self, index):
        if 0 <= index < len(self.tasks):
            self.tasks[index].complete()
    
    def get_pending(self):
        return [t for t in self.tasks if not t.completed]
    
    def sort_by_priority(self):
        self.tasks.sort(key=lambda t: t.priority, reverse=True)
    
    def show_all(self):
        for i, task in enumerate(self.tasks):

          </ul>
          <p>Теперь вы готовы к реальным проектам! Продолжайте практиковаться и изучать новые библиотеки.</p>
          <h3>Задание</h3>
          <p>Создайте собственный класс <code>Notebook</code> для заметок с методами: добавить, удалить, найти по тексту, показать все. Создайте несколько заметок и протестируйте.</p>
        `,
        initialCode: `class Notebook:\n    def __init__(self):\n        self.notes = []\n    \n    # Добавьте методы: add, remove, search, show_all\n\n# Создайте блокнот и протестируйте\n`,
        tests: [
          { text: 'Определён класс Notebook', check: (output, code) => /class\\s+Notebook/.test(code) },
          { text: 'Есть метод add', check: (output, code) => /def\\s+add/.test(code) },
          { text: 'Код выполняется без ошибок', check: (output, code) => !output.includes('Error') && !output.includes('Traceback') }
        ]
      }
    ]
  }
];

// ==================== СОСТОЯНИЕ ====================
let state = {
  currentLessonId: "1-1",
  completedLessons: new Set(),
  pyodide: null,
  userCode: {}
};

// Загрузка из localStorage
function loadState() {
  try {
    const saved = localStorage.getItem('pycamp_state');
    if (saved) {
      const data = JSON.parse(saved);
      state.completedLessons = new Set(data.completedLessons || []);
      state.userCode = data.userCode || {};
      if (data.currentLessonId) state.currentLessonId = data.currentLessonId;
    }
  } catch(e) { console.error('Load error:', e); }
}

function saveState() {
  try {
    localStorage.setItem('pycamp_state', JSON.stringify({
      currentLessonId: state.currentLessonId,
      completedLessons: Array.from(state.completedLessons),
      userCode: state.userCode
    }));
  } catch(e) { console.error('Save error:', e); }
}

// ==================== ПОЛУЧЕНИЕ ДАННЫХ ====================
function getAllLessons() {
  const lessons = [];
  course.forEach(module => {
    module.lessons.forEach(lesson => {
      lessons.push({ ...lesson, moduleId: module.id, moduleTitle: module.title });
    });
  });
  return lessons;
}

function getLessonById(id) {
  for (const module of course) {
    for (const lesson of module.lessons) {
      if (lesson.id === id) return { ...lesson, moduleId: module.id, moduleTitle: module.title };
    }
  }
  return null;
}

function getCurrentLessonIndex() {
  const all = getAllLessons();
  return all.findIndex(l => l.id === state.currentLessonId);
}

// ==================== РЕНДЕРИНГ ====================
function renderSidebar() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  
  course.forEach(module => {
    const moduleDiv = document.createElement('div');
    moduleDiv.className = 'mb-4';
    
    const moduleHeader = document.createElement('div');
    moduleHeader.className = 'text-xs uppercase tracking-wider text-[#acacac] font-bold mb-2 px-2';
    moduleHeader.textContent = `${module.id}. ${module.title}`;
    moduleDiv.appendChild(moduleHeader);
    
    module.lessons.forEach(lesson => {
      const btn = document.createElement('button');
      btn.className = 'lesson-btn w-full text-left px-3 py-2 rounded text-sm transition text-[#dfdfe2] hover:text-white';
      if (lesson.id === state.currentLessonId) btn.classList.add('active');
      if (state.completedLessons.has(lesson.id)) btn.classList.add('completed');
      btn.textContent = lesson.title;
      btn.onclick = () => {
        state.currentLessonId = lesson.id;
        saveState();
        renderAll();
      };
      moduleDiv.appendChild(btn);
    });
    
    list.appendChild(moduleDiv);
  });
}

function renderLesson() {
  const lesson = getLessonById(state.currentLessonId);
  if (!lesson) return;
  
  const header = document.getElementById('lessonHeader');
  header.innerHTML = `
    <div class="text-xs text-[#acacac] uppercase tracking-wider mb-2">
      ${lesson.moduleTitle} · Урок ${lesson.id}
    </div>
    <h1 class="text-3xl font-bold text-white">${lesson.title}</h1>
  `;
  
  document.getElementById('lessonContent').innerHTML = lesson.theory;
  
  // Тесты
  const testsSection = document.getElementById('testsSection');
  testsSection.innerHTML = `
    <h3 class="text-lg font-bold text-[#f1be32] mb-3">Тесты</h3>
    <div id="testsList">
      ${lesson.tests.map((t, i) => `
        <div class="test-item test-pending" data-index="${i}">
          <span class="test-status">○</span> ${t.text}
        </div>
      `).join('')}
    </div>
  `;
  
  // Код
  const editor = document.getElementById('codeEditor');
  if (state.userCode[lesson.id] !== undefined) {
    editor.value = state.userCode[lesson.id];
  } else {
    editor.value = lesson.initialCode;
  }
  
  // Навигация
  const allLessons = getAllLessons();
  const idx = getCurrentLessonIndex();
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('prevBtn').style.opacity = idx === 0 ? '0.5' : '1';
  document.getElementById('nextBtn').textContent = idx === allLessons.length - 1 ? 'Завершить курс 🎉' : 'Далее →';
  
  // Очистка консоли
  document.getElementById('consoleOutput').innerHTML = '';
}

function updateProgress() {
  const allLessons = getAllLessons();
  const completed = state.completedLessons.size;
  const total = allLessons.length;
  const percent = Math.round((completed / total) * 100);
  
  document.getElementById('headerProgress').style.width = percent + '%';
  document.getElementById('headerProgressText').textContent = `${completed}/${total}`;
}

function renderAll() {
  renderSidebar();
  renderLesson();
  updateProgress();
}

// ==================== ВЫПОЛНЕНИЕ КОДА ====================
async function runCode() {
  const code = document.getElementById('codeEditor').value;
  const consoleEl = document.getElementById('consoleOutput');
  consoleEl.innerHTML = '<span class="info">▶ Выполнение...</span>\n';
  
  if (!state.pyodide) {
    consoleEl.innerHTML = '<span class="error">Python ещё не загружен. Подождите...</span>\n';
    return;
  }
  
  state.pyodide.runPython(`
import sys
import io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);
  
  try {
    await state.pyodide.runPythonAsync(code);
    const stdout = state.pyodide.runPython('sys.stdout.getvalue()');
    const stderr = state.pyodide.runPython('sys.stderr.getvalue()');
    
    let output = '';
    if (stdout) output += stdout;
    if (stderr) output += `<span class="error">${stderr}</span>`;
    if (!stdout && !stderr) output = '<span class="info">✓ Код выполнен (нет вывода)</span>';
    
    consoleEl.innerHTML = output;
  } catch (err) {
    consoleEl.innerHTML = `<span class="error">❌ Ошибка:\n${err.message}</span>`;
  }
}

async function checkCode() {
  const lesson = getLessonById(state.currentLessonId);
  if (!lesson) return;
  
  const code = document.getElementById('codeEditor').value;
  const consoleEl = document.getElementById('consoleOutput');
  
  consoleEl.innerHTML = '<span class="info">▶ Проверка...</span>\n';
  
  if (!state.pyodide) {
    consoleEl.innerHTML = '<span class="error">Python ещё не загружен</span>\n';
    return;
  }
  
  // Сначала выполняем код
  state.pyodide.runPython(`
import sys
import io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);
  
  let output = '';
  let error = null;
  try {
    await state.pyodide.runPythonAsync(code);
    output = state.pyodide.runPython('sys.stdout.getvalue()');
  } catch (err) {
    error = err.message;
  }
  
  // Проверяем тесты
  const testResults = lesson.tests.map(test => {
    try {
      return test.check(output, code);
    } catch(e) {
      return false;
    }
  });
  
  // Отображаем результаты
  const testsList = document.getElementById('testsList');
  const testItems = testsList.querySelectorAll('.test-item');
  testItems.forEach((item, i) => {
    item.classList.remove('test-pass', 'test-fail', 'test-pending');
    if (testResults[i]) {
      item.classList.add('test-pass');
      item.querySelector('.test-status').textContent = '✓';
    } else {
      item.classList.add('test-fail');
      item.querySelector('.test-status').textContent = '✗';
    }
  });
  
  // Консоль
  let consoleOutput = '';
  if (error) {
    consoleOutput += `<span class="error">❌ Ошибка:\n${error}</span>\n\n`;
  } else if (output) {
    consoleOutput += `<span class="info">Вывод программы:</span>\n${output}\n`;
  }
  
  const passed = testResults.filter(r => r).length;
  const total = testResults.length;
  
  if (passed === total) {
    consoleOutput += `\n<span class="success">🎉 Все тесты пройдены! (${passed}/${total})</span>`;
    state.completedLessons.add(state.currentLessonId);
    saveState();
    renderSidebar();
    updateProgress();
  } else {
    consoleOutput += `\n<span class="error">Пройдено тестов: ${passed}/${total}</span>`;
  }
  
  consoleEl.innerHTML = consoleOutput;
}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
async function initPyodide() {
  try {
    state.pyodide = await loadPyodide();
    document.getElementById('loadingOverlay').style.display = 'none';
    console.log('Pyodide loaded');
  } catch (err) {
    document.getElementById('loadingOverlay').innerHTML = `
      <div class="text-center">
        <p class="text-[#ff6b6b] mb-2">Ошибка загрузки Python</p>
        <p class="text-sm text-[#acacac]">${err.message}</p>
        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-[#f1be32] text-[#0a0a23] rounded">
          Повторить
        </button>
      </div>
    `;
  }
}

// Tab в редакторе
document.getElementById('codeEditor').addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 4;
  }
});

// Автосохранение кода
document.getElementById('codeEditor').addEventListener('input', (e) => {
  state.userCode[state.currentLessonId] = e.target.value;
  saveState();
});

// Кнопки
document.getElementById('runBtn').onclick = runCode;
document.getElementById('checkBtn').onclick = checkCode;
document.getElementById('resetCodeBtn').onclick = () => {
  const lesson = getLessonById(state.currentLessonId);
  if (lesson) {
    document.getElementById('codeEditor').value = lesson.initialCode;
    state.userCode[state.currentLessonId] = lesson.initialCode;

  document.getElementById('consoleOutput').innerHTML = '';

document.getElementById('prevBtn').onclick = () => {
  const all = getAllLessons();
  const idx = getCurrentLessonIndex();
  if (idx > 0) {
    state.currentLessonId = all[idx - 1].id;
    saveState();
    renderAll();
  }

document.getElementById('nextBtn').onclick = () => {
  const all = getAllLessons();
  const idx = getCurrentLessonIndex();
  if (idx < all.length - 1) {
    state.currentLessonId = all[idx + 1].id;
    saveState();
    renderAll();

    alert('🎉 Поздравляем! Вы прошли весь курс Python!');

    state.completedLessons = new Set();
    state.userCode = {};
