<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>egormorozov708-hub / files</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  body {
    background-image: linear-gradient(rgba(10,14,20,0.85), rgba(10,14,20,0.92)), url('https://images.pexels.com/photos/10854007/pexels-photo-10854007.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1080&w=1920');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .file-row {
    transition: background-color 0.15s ease;
  }
  .file-row:hover {
    background-color: rgba(255,255,255,0.05);
  }

  /* Soldiers marching left to right */
  .soldier-lane {
    position: fixed;
    left: 0;
    width: 100%;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
    height: 40px;
  }
  .soldier {
    position: absolute;
    left: -60px;
    font-size: 28px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.6));
    animation-name: march;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes march {
    0% { transform: translateX(0) scaleX(-1); }
    100% { transform: translateX(calc(100vw + 100px)) scaleX(-1); }
  }
  .bob {
    animation: bob 0.4s ease-in-out infinite alternate;
  }
  @keyframes bob {
    from { margin-top: 0px; }
    to { margin-top: -4px; }
  }
</style>
</head>
<body class="min-h-screen text-gray-200 font-sans relative">

  <!-- Marching soldiers lanes -->
  <div class="soldier-lane" style="top: 90px;">
    <div class="soldier bob" style="animation-duration: 14s; animation-delay: 0s;">🪖</div>
    <div class="soldier bob" style="animation-duration: 16s; animation-delay: 4s;">🪖</div>
    <div class="soldier bob" style="animation-duration: 18s; animation-delay: 9s;">🪖</div>
  </div>
  <div class="soldier-lane" style="top: 200px;">
    <div class="soldier bob" style="animation-duration: 20s; animation-delay: 2s;">💂</div>
    <div class="soldier bob" style="animation-duration: 15s; animation-delay: 7s;">💂</div>
  </div>
  <div class="soldier-lane" style="top: 320px;">
    <div class="soldier bob" style="animation-duration: 17s; animation-delay: 1s;">🪖</div>
    <div class="soldier bob" style="animation-duration: 19s; animation-delay: 6s;">💂</div>
    <div class="soldier bob" style="animation-duration: 13s; animation-delay: 11s;">🪖</div>
  </div>
  <div class="soldier-lane" style="bottom: 60px;">
    <div class="soldier bob" style="animation-duration: 21s; animation-delay: 3s;">💂</div>
    <div class="soldier bob" style="animation-duration: 16s; animation-delay: 10s;">🪖</div>
  </div>

  <div class="relative z-10 max-w-4xl mx-auto mt-10 mb-20 px-4">

    <!-- Header bar -->
    <div class="flex items-center gap-3 bg-[#0d1117]/90 border border-gray-700 rounded-t-lg px-4 py-3">
      <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-sm font-bold text-black">🪖</div>
      <div class="text-sm">
        <span class="font-semibold text-white">egormorozov708-hub</span>
        <span class="text-gray-400"> Создать файл QwenAgent.html</span>
      </div>
      <div class="ml-auto flex items-center gap-4 text-xs text-gray-400">
        <span>bd09d8a · сейчас</span>
        <span class="flex items-center gap-1">🕒 15 подтверждений</span>
      </div>
    </div>

    <!-- File list -->
    <div id="fileList" class="bg-[#0d1117]/90 border border-t-0 border-gray-700 rounded-b-lg overflow-hidden">
      <!-- rows injected by JS -->
    </div>

    <p class="text-center text-xs text-gray-500 mt-6">
      Нажмите на файл, чтобы открыть его. Солдатики маршируют мирно, никого не трогают 🫡
    </p>
  </div>

<script>
  const files = [
    { name: "Qwen.html", msg: "Добавляйте файлы через загрузку.", time: "4 дня назад" },
    { name: "QwenAgent.html", msg: "Создать файл QwenAgent.html", time: "сейчас" },
    { name: "Qwenvp.html", msg: "Добавляйте файлы через загрузку.", time: "4 дня назад" },
    { name: "YaGPT.html", msg: "Создайте файл YaGPT.html", time: "вчера" },
    { name: "index.html", msg: "Создайте файл index.html", time: "44 минуты назад" },
    { name: "openclaw.html", msg: "Добавляйте файлы через загрузку.", time: "49 минут назад" },
    { name: "zai.html", msg: "Добавляйте файлы через загрузку.", time: "4 дня назад" }
  ];

  const fileIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" viewBox="0 0 16 16" fill="currentColor">
      <path d="M2 1.75C2 .784 2.784 0 3.75 0h5.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v8.586A1.75 1.75 0 0 1 12.25 15h-8.5A1.75 1.75 0 0 1 2 13.25Z"/>
    </svg>`;

  const container = document.getElementById('fileList');
  files.forEach((f, i) => {
    const row = document.createElement('a');
    row.href = f.name;
    row.className = "file-row flex items-center gap-3 px-4 py-3 text-sm border-b border-gray-800 last:border-b-0 no-underline";
    row.innerHTML = `
      ${fileIcon}
      <span class="text-blue-400 hover:underline font-medium w-40 shrink-0 truncate">${f.name}</span>
      <span class="text-gray-400 truncate flex-1">${f.msg}</span>
      <span class="text-gray-500 text-xs whitespace-nowrap">${f.time}</span>
    `;
    container.appendChild(row);
  });
</script>

</body>
</html>
