<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClaw — бесплатный курс Python</title>
<style>
:root{
  --bg:#0b0f17;
  --bg2:#0f1521;
  --panel:#121a28;
  --panel2:#162032;
  --border:#222f45;
  --text:#e6edf6;
  --muted:#8ea0bb;
  --accent:#7c5cff;
  --accent2:#22d3ee;
  --ok:#3fb950;
  --err:#f85149;
  --warn:#e3b341;
  --code-bg:#0a0e16;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --radius:14px;
}
body.light{
  --bg:#f4f6fb;
  --bg2:#ffffff;
  --panel:#ffffff;
  --panel2:#f0f3fa;
  --border:#dde3ee;
  --text:#111827;
  --muted:#5b6b83;
  --code-bg:#0f1521;
  --shadow:0 8px 26px rgba(20,30,60,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  transition:background .25s,color .25s;
}
button,input,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3a55;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3b4f74;background-clip:content-box}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.main{display:grid;grid-template-columns:320px 1fr;min-height:0}

/* ---------- Header ---------- */
header{
  display:flex;align-items:center;gap:16px;
  padding:12px 18px;
  background:linear-gradient(180deg,var(--bg2),transparent);
  border-bottom:1px solid var(--border);
  z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.3px;white-space:nowrap}
.brand .logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:19px;color:#fff;
  box-shadow:0 4px 16px rgba(124,92,255,.45);
}
.brand span.grad{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.header-progress{flex:1;display:flex;align-items:center;gap:12px;min-width:120px}
.bar{flex:1;height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
.progress-text{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbtn{
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
  transition:.18s;white-space:nowrap;
}
.hbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.hbtn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pystatus{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px currentColor}
.dot.ready{background:var(--ok)}
.dot.error{background:var(--err)}
#burger{display:none}

/* ---------- Sidebar ---------- */
aside{
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;padding:14px 10px 40px;
}
.mod{margin-bottom:6px}
.mod-head{
  display:flex;align-items:center;gap:9px;padding:10px 10px;
  font-weight:700;font-size:13.5px;color:var(--text);cursor:pointer;border-radius:10px;
  user-select:none;
}
.mod-head:hover{background:var(--panel)}
.mod-head .arrow{margin-left:auto;font-size:11px;color:var(--muted);transition:transform .22s}
.mod.collapsed .arrow{transform:rotate(-90deg)}
.mod.collapsed .mod-body{display:none}
.mod-body{padding-left:4px}
.lesson{
  display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:9px;
  cursor:pointer;font-size:13px;color:var(--muted);line-height:1.35;transition:.15s;
  border-left:2px solid transparent;
}
.lesson:hover{background:var(--panel);color:var(--text)}
.lesson.active{background:var(--panel2);color:var(--text);border-left-color:var(--accent);font-weight:600}
.lesson .n{
  flex:0 0 20px;height:20px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);
  display:grid;place-items:center;font-size:10.5px;font-weight:700;margin-top:1px;
}
.lesson.done .n{background:var(--ok);border-color:var(--ok);color:#04140a}
.lesson.done .n::after{content:"✓";font-size:11px}
.lesson.done .n span{display:none}
.lesson.active .n{border-color:var(--accent)}

/* ---------- Content ---------- */
section.content{overflow-y:auto;padding:28px 40px 90px;min-width:0}
.wrap{max-width:900px;margin:0 auto}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:8px;letter-spacing:.4px;text-transform:uppercase;font-weight:700}
h1.title{font-size:31px;margin:0 0 18px;line-height:1.2;letter-spacing:-.4px}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow);
}
.theory p{line-height:1.72;margin:0 0 13px;font-size:15px}
.theory ul,.theory ol{line-height:1.75;margin:0 0 14px;padding-left:22px;font-size:15px}
.theory li{margin-bottom:5px}
.theory b{color:#fff}
body.light .theory b{color:#000}
.theory code{
  background:var(--panel2);padding:2px 6px;border-radius:6px;
  font-family:'Consolas','SF Mono',Monaco,monospace;font-size:13.5px;color:var(--accent2);
  border:1px solid var(--border);
}
.theory pre{
  background:var(--code-bg);border:1px solid var(--border);border-radius:11px;
  padding:14px 16px;overflow-x:auto;margin:0 0 16px;position:relative;
}
body.light .theory pre{background:#0f1521}
.theory pre code{
  background:none;border:none;padding:0;color:#d9e4f5;font-size:13.5px;line-height:1.65;
  font-family:'Consolas','SF Mono',Monaco,monospace;white-space:pre;
}
.theory .note{
  border-left:3px solid var(--accent2);background:rgba(34,211,238,.07);
  padding:11px 15px;border-radius:0 9px 9px 0;margin:0 0 16px;font-size:14px;line-height:1.65;
}
.theory .warn{
  border-left:3px solid var(--warn);background:rgba(227,179,65,.07);
  padding:11px 15px;border-radius:0 9px 9px 0;margin:0 0 16px;font-size:14px;line-height:1.65;
}
h2.sec{
  font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:9px;letter-spacing:.2px;
  text-transform:uppercase;color:var(--muted);font-weight:800;
}
h2.sec::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--accent2))}

/* ---------- Code / Editor ---------- */
.codeblock{
  background:var(--code-bg);border:1px solid var(--border);border-radius:11px;overflow:hidden;
  margin-bottom:12px;
}
body.light .codeblock{background:#0f1521}
.codeblock pre{
  margin:0;padding:14px 16px;overflow-x:auto;color:#d9e4f5;
  font-family:'Consolas','SF Mono',Monaco,monospace;font-size:13.5px;line-height:1.65;white-space:pre;
}
.codewrap{display:flex;background:var(--code-bg);border:1px solid var(--border);border-radius:11px;overflow:hidden;position:relative;min-height:150px}
body.light .codewrap{background:#0f1521}
.gutter{
  padding:12px 8px 12px 12px;color:#4a5b78;font-family:'Consolas',Monaco,monospace;font-size:13.5px;
  line-height:1.6;text-align:right;user-select:none;background:rgba(255,255,255,.02);
  border-right:1px solid #1c2740;min-width:44px;overflow:hidden;
}
#editor{
  flex:1;background:transparent;border:none;outline:none;resize:vertical;color:#d9e4f5;
  padding:12px 14px;font-family:'Consolas','SF Mono',Monaco,monospace;font-size:13.5px;
  line-height:1.6;tab-size:4;min-height:150px;white-space:pre;overflow-wrap:normal;overflow-x:auto;
}
.console{
  background:#05080e;border:1px solid var(--border);border-radius:11px;padding:12px 14px;
  font-family:'Consolas',Monaco,monospace;font-size:13px;line-height:1.6;color:#b9c8dd;
  min-height:52px;max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
}
.console .err{color:#ff7b72}
.console .placeholder{color:#40506b;font-style:italic}

/* ---------- Buttons ---------- */
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;
  border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;
  font-size:13.5px;font-weight:600;transition:.16s;
}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5b3ff0);border-color:transparent;color:#fff;box-shadow:0 5px 18px rgba(124,92,255,.35)}
.btn.ok{background:linear-gradient(135deg,#2ea043,#3fb950);border-color:transparent;color:#fff;box-shadow:0 5px 18px rgba(63,185,80,.3)}
.btn.ghost{background:transparent}
.spacer{flex:1}

/* ---------- Verdict ---------- */
.verdict{
  margin-top:14px;padding:13px 16px;border-radius:11px;font-size:14px;line-height:1.6;
  display:none;white-space:pre-wrap;font-weight:600;
}
.verdict.show{display:block;animation:slideIn .25s ease}
.verdict.good{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.45);color:#7ee787}
.verdict.bad{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.45);color:#ff9d96}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- Nav footer ---------- */
.navbtns{display:flex;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--border)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(3,6,12,.78);backdrop-filter:blur(5px);
  display:none;place-items:center;z-index:100;padding:20px;
}
.overlay.show{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 28px;
  max-width:520px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.modal h3{margin:0 0 14px;font-size:20px}
.modal p{line-height:1.65;color:var(--muted);font-size:14px;margin:0 0 14px}
.cert{
  border:3px double var(--accent);border-radius:14px;padding:24px;text-align:center;
  background:linear-gradient(160deg,rgba(124,92,255,.13),rgba(34,211,238,.08));margin:16px 0;
}
.cert .seal{font-size:42px}
.cert h4{margin:8px 0 4px;font-size:22px;letter-spacing:.5px}
.cert .sub{color:var(--muted);font-size:13px}

/* ---------- Misc ---------- */
.loader{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:980px){
  .main{grid-template-columns:1fr}
  aside{
    position:fixed;top:0;left:0;bottom:0;width:300px;z-index:60;
    transform:translateX(-102%);transition:transform .26s ease;box-shadow:0 0 50px rgba(0,0,0,.6);
    padding-top:70px;
  }
  aside.open{transform:none}
  #burger{display:inline-flex}
  section.content{padding:20px 18px 80px}
  h1.title{font-size:24px}
  .header-progress{display:none}
  .brand .txt{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="hbtn" id="burger" title="Меню">☰</button>
    <div class="brand">
      <div class="logo">🐍</div>
      <div class="txt">Open<span class="grad">Claw</span></div>
    </div>
    <div class="header-progress">
      <div class="bar"><i id="barFill"></i></div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>
    <div class="pystatus" id="pyStatus"><span class="dot"></span><span id="pyStatusText">Загрузка Python…</span></div>
    <button class="hbtn" id="certBtn" disabled title="Пройди весь курс">🏆 Сертификат</button>
    <button class="hbtn" id="themeBtn" title="Сменить тему">🌙</button>
    <button class="hbtn" id="resetBtn" title="Сбросить прогресс">↺</button>
  </header>

  <div class="main">
    <aside id="sidebar"></aside>
    <section class="content" id="content">
      <div class="wrap" id="lessonRoot"></div>
    </section>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
/* =======================================================================
   OpenClaw — открытый курс Python
   Один файл: теория + редактор + исполнение Python прямо в браузере
   ======================================================================= */

/* ------------------------- КУРС ------------------------- */
const COURSE = [
/* ======================= МОДУЛЬ 1 ======================= */
{
  title: "Модуль 1 · Основы Python",
  icon: "🌱",
  lessons: [
    {
      id: "m1l1",
      title: "print() — первая команда",
      theory: `
<p><b>Python</b> — один из самых популярных языков программирования в мире. На нём пишут сайты, игры, нейросети, автоматизацию и научные расчёты. Программа на Python — это набор инструкций, которые выполняются сверху вниз, строка за строкой.</p>
<p>Самая первая и самая полезная команда — <code>print()</code>. Она выводит информацию на экран.</p>
<pre><code>print("Привет, мир!")</code></pre>
<p>Текст в кавычках называется <b>строкой</b> (тип <code>str</code>). Кавычки могут быть одинарными <code>'...'</code> или двойными <code>"..."</code> — разницы нет.</p>
<p><code>print()</code> умеет принимать сразу несколько значений — они разделяются пробелом:</p>
<pre><code>print("Python", "это", "круто")
# Python это круто</code></pre>
<p>Два полезных параметра:</p>
<ul>
  <li><code>sep</code> — чем разделять значения (по умолчанию пробел);</li>
  <li><code>end</code> — чем заканчивать строку (по умолчанию перевод строки).</li>
</ul>
<pre><code>print("a", "b", sep="-")     # a-b
print("без переноса", end=" ")
print("продолжение")          # без переноса продолжение</code></pre>
<div class="note">💡 Каждый вызов <code>print()</code> сам по себе уже завершает строку, поэтому дополнительный перевод строки добавлять не нужно.</div>`,
      example: `print("Привет, мир!")
print("Python", "это", "круто")
print("a", "b", "c", sep=" + ")`,
      task: {
        text: "Выведи три строки — каждую с новой строки, ровно в таком виде:\n\nPython\nэто\nкруто",
        starter: "# Напиши три команды print ниже\n\n",
        tests: `_lines = [l for l in _stdout.strip().splitlines() if l.strip() != ""]
assert len(_lines) == 3, "Нужно ровно 3 строки вывода, а получилось " + str(len(_lines))
assert _lines[0].strip() == "Python", "Первая строка должна быть: Python (получено: " + _lines[0] + ")"
assert _lines[1].strip() == "это", "Вторая строка должна быть: это (получено: " + _lines[1] + ")"
assert _lines[2].strip() == "круто", "Третья строка должна быть: круто (получено: " + _lines[2] + ")"`,
        hint: "Нужно три отдельных вызова print() — по одному на каждую строку.",
        solution: `print("Python")
print("это")
print("круто")`
      }
    },
    {
      id: "m1l2",
      title: "Переменные и типы данных",
      theory: `
<p><b>Переменная</b> — это именованная «коробка», в которой хранится значение. Создаётся она простым присваиванием:</p>
<pre><code>name = "Ада"
age = 36
height = 1.68
is_programmer = True</code></pre>
<p>Python — язык с <b>динамической типизацией</b>: тип определяется автоматически по значению, указывать его вручную не нужно. Значение можно легко заменить на другое, даже другого типа.</p>
<p>Основные типы:</p>
<ul>
  <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>1000000</code></li>
  <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code>, <code>2.0</code></li>
  <li><code>str</code> — строки: <code>"привет"</code></li>
  <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
  <li><code>NoneType</code> — единственное значение <code>None</code> («ничего»)</li>
</ul>
<p>Узнать тип можно функцией <code>type()</code>:</p>
<pre><code>x = 3.14
print(type(x))     # &lt;class 'float'&gt;</code></pre>
<p>Правила именования:</p>
<ul>
  <li>можно буквы, цифры и подчёркивания, но имя не начинается с цифры;</li>
  <li>регистр важен: <code>age</code> и <code>Age</code> — разные переменные;</li>
  <li>по соглашению PEP 8 используется <code>snake_case</code>: <code>user_name</code>, а не <code>userName</code>;</li>
  <li>нельзя использовать зарезервированные слова: <code>if</code>, <code>for</code>, <code>class</code>, <code>def</code> и т. д.</li>
</ul>
<p>Множественное присваивание и обмен значений:</p>
<pre><code>a, b = 1, 2
a, b = b, a        # a=2, b=1
x = y = z = 0      # всем трём сразу 0</code></pre>`,
      example: `name = "Python"
version = 3.13
is_cool = True

print(name, version, is_cool)
print(type(name))
print(type(version))
print(type(is_cool))`,
      task: {
        text: "Создай три переменные:\n\n• name — строка \"Python\"\n• version — число 3.13\n• is_cool — логическое True\n\nНичего выводить не нужно, проверка сама заглянет в переменные.",
        starter: "# Создай переменные ниже\n\n",
        tests: `_need("name"); _need("version"); _need("is_cool")
assert name == "Python", "name должно быть строкой 'Python'"
assert isinstance(name, str), "name должно иметь тип str"
assert version == 3.13, "version должно быть равно 3.13"
assert isinstance(version, float), "version должно быть числом с плавающей точкой (float)"
assert is_cool is True, "is_cool должно быть True (именно логическое значение)"`,
        hint: "Записывай так: имя = значение. Строку бери в кавычки, True пиши с большой буквы и без кавычек.",
        solution: `name = "Python"
version = 3.13
is_cool = True`
      }
    },
    {
      id: "m1l3",
      title: "Числа и арифметика",
      theory: `
<p>Python — отличный калькулятор. Основные операторы:</p>
<pre><code>7 + 3      # 10   сложение
7 - 3      # 4    вычитание
7 * 3      # 21   умножение
7 / 3      # 2.3333…   деление (всегда даёт float)
7 // 3     # 2    целочисленное деление (отбрасывает дробную часть)
7 % 3      # 1    остаток от деления
7 ** 3     # 343  возведение в степень</code></pre>
<p>Приоритет операций — как в математике: сначала <code>**</code>, затем <code>* / // %</code>, затем <code>+ -</code>. Скобки меняют порядок.</p>
<pre><code>2 + 3 * 4      # 14
(2 + 3) * 4    # 20</code></pre>
<p>Полезные встроенные функции:</p>
<pre><code>abs(-5)          # 5      модуль числа
round(3.14159, 2) # 3.14  округление
pow(2, 10)       # 1024
min(3, 1, 9)     # 1
max(3, 1, 9)     # 9
divmod(17, 5)    # (3, 2)  частное и остаток сразу</code></pre>
<p>Остаток <code>%</code> — очень полезная вещь. Например, проверить чётность:</p>
<pre><code>n = 8

{
  title: "Модуль 6 · Продвинутый Python",
  icon: "🚀",

    {
      id: "m6l1",
      title: "Обработка исключений",
      theory: `
<p><b>Исключение</b> (exception) — ошибка времени выполнения. Если её не обработать, программа аварийно завершится.</p>
<pre><code>try:
    number = int(input("Число: "))
    print(10 / number)
except ValueError:
    print("Это не число!")
except ZeroDivisionError:
    print("На ноль делить нельзя!")
except Exception as e:
    print("Что-то пошло не так:", e)
else:
    print("Ошибок не было")
finally:
    print("Этот блок выполняется всегда")</code></pre>
<p>Разбор блоков:</p>
<ul>
  <li><code>try</code> — код, который может упасть;</li>
  <li><code>except ТипОшибки</code> — что делать при этой ошибке;</li>
  <li><code>else</code> — выполняется, если исключения не было;</li>
  <li><code>finally</code> — выполняется в любом случае (закрытие файлов, соединений).</li>
</ul>
<p>Частые исключения:</p>
<pre><code>ValueError          # неверное значение: int("abc")
TypeError           # неверный тип: "2" + 2
KeyError            # нет такого ключа в словаре
IndexError          # индекс вне диапазона
ZeroDivisionError   # деление на ноль
FileNotFoundError   # нет такого файла
AttributeError      # нет такого атрибута</code></pre>
<p>Собственное исключение через <code>raise</code>:</p>
<pre><code>def set_age(age):
    if age &lt; 0:
        raise ValueError("Возраст не может быть отрицательным")
    return age</code></pre>
<p>Свои классы исключений:</p>

<p><b>Генератор</b> — функция, которая отдаёт значения по одному, «замирая» на каждом <code>yield</code>. Это позволяет работать с последовательностями, не храня их целиком в памяти.</p>
<pre><code>def countdown(n):
    while n > 0:
        yield n
        n -= 1

for x in countdown(5):
    print(x)     # 5 4 3 2 1</code></pre>
<p>Разница с обычной функцией:</p>
<ul>
  <li><code>return</code> завершает функцию и отдаёт одно значение;</li>
  <li><code>yield</code> приостанавливает функцию, отдаёт значение и запоминает состояние.</li>
</ul>
<p>Ручной обход генератора:</p>
<pre><code>gen = countdown(3)
next(gen)   # 3
next(gen)   # 2
next(gen)   # 1
next(gen)   # StopIteration</code></pre>
<p><b>Выражения-генераторы</b> выглядят как list comprehension, но в круглых скобках:</p>
<pre><code>squares = (x * x for x in range(1000000))   # мгновенно, память почти не тратится
sum(squares)</code></pre>
<p>Почему это важно — сравните память:</p>
<pre><code>sum([x * x for x in range(10_000_000)])   # создаёт список из 10 млн чисел
sum(x * x for x in range(10_000_000))     # вычисляет по одному</code></pre>

<pre><code>def naturals():

<p>В Python функции — это объекты. Их можно передавать как аргументы и возвращать из других функций.</p>
<pre><code>def shout(text):
    return text.upper()

def whisper(text):
    return text.lower()

def transform(func, text):
    return func(text)

print(transform(shout, "привет"))    # ПРИВЕТ</code></pre>
<p><b>Декоратор</b> — функция, которая принимает функцию и возвращает новую, добавляя поведение «вокруг»:</p>
<pre><code>def logger(func):
    def wrapper(*args, **kwargs):
        print(f"Вызов {func.__name__} с {args}")
        result = func(*args, **kwargs)
        print(f"Результат: {result}")
        return result
    return wrapper

@logger
def add(a, b):
    return a + b

add(2, 3)</code></pre>
<p>Запись <code>@logger</code> — это синтаксический сахар:</p>
<pre><code>def add(a, b):
    return a + b
add = logger(add)      # то же самое</code></pre>
<p>Декоратор с параметрами — функция, возвращающая декоратор:</p>
<pre><code>def repeat(times):
    def decorator(func):
        def wrapper(*args, **kwargs):
            result = None
            for _ in range(times):
                result = func(*args, **kwargs)
            return result
        return wrapper
    return decorator

@repeat(3)
def say_hi():
    print("Привет!")</code></pre>
<p>Важно сохранять метаданные с помощью <code>functools.wraps</code>:</p>
<pre><code>from functools import wraps

def logger(func):
    @wraps(func)
    def wrapper(*args, **kwargs):
        return func(*args, **kwargs)
    return wrapper</code></pre>
<p>Декораторы широко используются во фреймворках: <code>@app.route</code> во Flask, <code>@pytest.fixture</code>, <code>@property</code>, <code>@staticmethod</code>.</p>`,

    def wrapper(*args, **kwargs):
        print(f"→ вызов {func.__name__}({args})")
        result = func(*args, **kwargs)
        print(f"← вернулось {result}")
        return result
    return wrapper

@logger
def multiply(a, b):

multiply(4, 5)

            result = None
            for _ in range(times):
                result = func(*args, **kwargs)

    return decorator

<p>Ключевые решения, которые стоит продумать:</p>
<pre><code>class InsufficientFunds(Exception):

<p>Счёт должен уметь:

<p>Банк должен:

<div class="note">💡 Именно так и устроена реальная разработка: маленькие классы с чёткой ответственностью, соединённые вместе.</div>`,
      example: `class InsufficientFunds(Exception):

class Account:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self._balance = balance
        self.history = []

    @property
    def balance(self):
        return self._balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Сумма должна быть положительной")
        self._balance += amount
        self.history.append(("deposit", amount))
        return self._balance

    def withdraw(self, amount):
        if amount <= 0:
            raise ValueError("Сумма должна быть положительной")
        if amount > self._balance:
            raise InsufficientFunds(f"На счёте {self.owner} только {self._balance}")
        self._balance -= amount
        self.history.append(("withdraw", amount))
        return self._balance

    def __str__(self):
        return f"{self.owner}: {self._balance} ₽"

acc = Account("Ада", 100)

assert a.deposit(50) == 150, "deposit(50) должен вернуть 150, получено: " + str(a.deposit(50))
assert a.withdraw(30) == 120, "withdraw(30) должен вернуть 120"
assert str(a) == "Ада: 120 ₽", "__str__ вернул: " + repr(str(a))

# --- Ошибки ---
try:
    a.deposit(-5)
    assert False, "deposit(-5) должен бросать ValueError"
except ValueError:
    pass

try:
    a.withdraw(10_000)
    assert False, "withdraw(10000) должен бросать InsufficientFunds"
except InsufficientFunds:
    pass

assert a.balance == 120, "Неудачные операции не должны менять баланс"

# --- Наследование ---
s = SavingsAccount("Боб", 1000, rate=10)
assert isinstance(s, Account), "SavingsAccount должен наследовать Account"
assert s.rate == 10, "Атрибут rate должен быть 10"
assert s.add_interest() == 1100.0, "10% от 1000 = 1100, получено: " + str(s.add_interest())

# --- Банк ---
bank = Bank()
bank.open_account("Ада", 500)
bank.open_account("Боб", 250)
bank.open_account("Ева", 1200, savings=True)
assert bank.get("Ада").balance == 500, "Счёт 'Ада' должен иметь баланс 500"
assert bank.get("НетТакого") is None, "Неизвестный клиент → None"
assert bank.total_money() == 1950, "Итого должно быть 1950, получено: " + str(bank.total_money())
assert bank.rich_clients(500) == ["Ада", "Ева"], "rich_clients(500) должно быть ['Ада','Ева'], получено: " + str(bank.rich_clients(500))`,
        hint: "SavingsAccount.add_interest: self._balance += self._balance * self.rate / 100; return self._balance. В Bank.open_account создавай SavingsAccount, если savings=True, и сохраняй в self.accounts[owner]. rich_clients: [name for name, acc in self.accounts.items() if acc.balance >= threshold].",
        solution: `class InsufficientFunds(Exception):
    pass


class Account:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self._balance = balance

    @property
    def balance(self):
        return self._balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Сумма должна быть положительной")
        self._balance += amount
        return self._balance

    def withdraw(self, amount):
        if amount <= 0:
            raise ValueError("Сумма должна быть положительной")
        if amount > self._balance:
            raise InsufficientFunds(f"Недостаточно средств: {self._balance}")
        self._balance -= amount
        return self._balance

    def __str__(self):
        return f"{self.owner}: {self._balance} ₽"

    def __eq__(self, other):
        return self.owner == other.owner and self._balance == other._balance


class SavingsAccount(Account):
    def __init__(self, owner, balance=0, rate=5):
        super().__init__(owner, balance)
        self.rate = rate

    def add_interest(self):
        self._balance += self._balance * self.rate / 100
        return self._balance


class Bank:
    def __init__(self):
        self.accounts = {}

    def open_account(self, owner, savings=False):
        if savings:
            acc = SavingsAccount(owner, 0)
        else:
            acc = Account(owner, 0)
        self.accounts[owner] = acc
        return acc

    def get(self, owner):
        return self.accounts.get(owner)

    def total_money(self):
        return sum(acc.balance for acc in self.accounts.values())

    def rich_clients(self, threshold):
        return [name for name, acc in self.accounts.items() if acc.balance >= threshold]`
      }
    }
  ]
}
];

/* =======================================================================
   Приложение
   ======================================================================= */

/* ------- Плоский список уроков ------- */
const FLAT = [];
COURSE.forEach((mod, mi) => {
  mod.lessons.forEach((lesson, li) => {
    FLAT.push({
      ...lesson,
      moduleIndex: mi,
      moduleTitle: mod.title,
      moduleIcon: mod.icon,
      lessonIndex: li,
      globalIndex: FLAT.length
    });
  });
});

/* ------- Состояние ------- */
const STORAGE_KEY = "openclaw_python_v1";
let state = {
  current: 0,
  completed: {},
  code: {},
  theme: "dark",
  collapsed: {}
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state.completed = s.completed || {};
      state.code = s.code || {};
      state.current = s.current || 0;
      state.theme = s.theme || "dark";
      state.collapsed = s.collapsed || {};
    }
  } catch (e) { /* игнорируем */ }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      completed: state.completed,
      code: state.code,
      current: state.current,
      theme: state.theme,
      collapsed: state.collapsed
    }));
  } catch (e) { /* переполнение — игнорируем */ }
}

/* ------- Утилиты ------- */
const $ = sel => document.querySelector(sel);
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/* ------- Pyodide ------- */
let pyodide = null;
let pyReady = false;
let stdoutSinkEl = null;
let captureBuf = null;
let running = false;

function setPyStatus(kind, text) {
  const dot = $("#pyStatus .dot");
  dot.className = "dot " + (kind === "ready" ? "ready" : kind === "error" ? "error" : "");
  $("#pyStatusText").textContent = text;
}

async function initPython() {
  if (typeof loadPyodide === "undefined") {
    setPyStatus("error", "Нет доступа к Python");
    return;
  }
  try {
    setPyStatus("loading", "Загрузка Python…");
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
    });
    pyodide.setStdout({ batched: (s) => handleOutput(s, false) });
    pyodide.setStderr({ batched: (s) => handleOutput(s, true) });
    pyReady = true;
    setPyStatus("ready", "Python 3.12 готов");
    document.querySelectorAll(".run-btn").forEach(b => b.disabled = false);
  } catch (e) {
    setPyStatus("error", "Python недоступен (нет интернета?)");
    console.error(e);
  }
}

function handleOutput(text, isErr) {
  if (captureBuf) captureBuf.push(text);
  if (stdoutSinkEl) {
    const span = el("span", isErr ? "err" : "", text);
    stdoutSinkEl.appendChild(span);
    stdoutSinkEl.scrollTop = stdoutSinkEl.scrollHeight;
  }
}

/* Предзагрузка: подмена input() и вспомогательные функции */
function buildPrelude(stdinLines) {
  const arr = JSON.stringify(stdinLines || []);
  return `
import builtins as _bi
__name__ = "__main__"
_fake_inputs = list(${arr})
def _fake_input(prompt=""):
    if _fake_inputs:
        return _fake_inputs.pop(0)
    return ""
_bi.input = _fake_input

def _need(name, kind="значение"):
    if name not in globals():
        raise AssertionError("Не найдено: " + name + ". Проверь название.")
    return globals()[name]
`;
}

async function executePython(code, tests, stdinLines, sinkEl) {
  if (!pyReady) throw new Error("Python ещё не загружен. Подожди немного и попробуй снова.");
  const ns = pyodide.globals.get("dict")();
  const oldSink = stdoutSinkEl;
  stdoutSinkEl = sinkEl;
  try {
    await pyodide.runPythonAsync(buildPrelude(stdinLines), { globals: ns });

    captureBuf = [];
    await pyodide.runPythonAsync(code, { globals: ns });
    const studentOut = captureBuf.join("");
    captureBuf = null;

    await pyodide.runPythonAsync("_stdout = " + JSON.stringify(studentOut), { globals: ns });
    await pyodide.runPythonAsync("_src = " + JSON.stringify(code), { globals: ns });

    if (tests) {
      await pyodide.runPythonAsync(tests, { globals: ns });
    }
    return { ok: true };
  } finally {
    captureBuf = null;
    ns.destroy();
    stdoutSinkEl = oldSink;
  }
}

/* ------- Рендер сайдбара ------- */
function renderSidebar() {
  const aside = $("#sidebar");
  aside.innerHTML = "";
  COURSE.forEach((mod, mi) => {
    const wrap = el("div", "mod" + (state.collapsed[mi] ? " collapsed" : ""));

    const head = el("div", "mod-head");
    head.appendChild(el("span", "", mod.icon));
    head.appendChild(el("span", "", mod.title));
    head.appendChild(el("span", "arrow", "▾"));
    head.onclick = () => {
      state.collapsed[mi] = !state.collapsed[mi];
      wrap.classList.toggle("collapsed");
      saveState();
    };
    wrap.appendChild(head);

    const body = el("div", "mod-body");
    mod.lessons.forEach((lesson, li) => {
      const idx = FLAT.findIndex(l => l.id === lesson.id);
      const row = el("div", "lesson" + (state.completed[lesson.id] ? " done" : "") + (idx === state.current ? " active" : ""));
      const num = el("div", "n");
      num.appendChild(el("span", "", String(li + 1)));
      row.appendChild(num);
      row.appendChild(el("div", "", lesson.title));
      row.onclick = () => goTo(idx);
      body.appendChild(row);
    });
    wrap.appendChild(body);
    aside.appendChild(wrap);
  });
  updateProgress();
}

function updateProgress() {
  const total = FLAT.length;
  const done = Object.keys(state.completed).filter(k => state.completed[k]).length;
  const pct = total ? (done / total) * 100 : 0;
  $("#barFill").style.width = pct + "%";
  $("#progressText").textContent = done + " / " + total;
  $("#certBtn").disabled = done < total;
}

/* ------- Рендер урока ------- */
let currentEditor = null;

function goTo(index) {
  if (index < 0 || index >= FLAT.length) return;
  state.current = index;
  saveState();
  renderLesson();
  renderSidebar();
  $("#content").scrollTop = 0;
  if (window.innerWidth <= 980) $("#sidebar").classList.remove("open");
}

function renderLesson() {
  const L = FLAT[state.current];
  const root = $("#lessonRoot");
  root.innerHTML = "";

  // Хлебные крошки
  root.appendChild(el("div", "crumb", L.moduleIcon + "  " + L.moduleTitle));

  // Заголовок
  const h1 = el("h1", "title", L.title);
  root.appendChild(h1);

  // Теория
  const theory = el("div", "card theory");
  theory.innerHTML = `<h2 class="sec">Теория</h2>` + L.theory;
  root.appendChild(theory);

  // Пример
  const exCard = el("div", "card");
  exCard.innerHTML = `<h2 class="sec">Пример</h2>`;
  const exCode = el("div", "codeblock");
  exCode.appendChild(el("pre", "", L.example));
  exCard.appendChild(exCode);

  const exOut = el("div", "console");
  exOut.innerHTML = '<span class="placeholder">Здесь появится результат…</span>';
  const exRow = el("div", "row");
  const exRun = el("button", "btn primary run-btn", "▶ Запустить пример");
  exRun.disabled = !pyReady;
  exRun.onclick = async () => {
    if (running) return;
    running = true;
    exOut.innerHTML = "";
    exRun.disabled = true;
    try {
      await executePython(L.example, null, null, exOut);
    } catch (e) {
      handleOutput(String(e.message || e) + "\n", true);
      if (exOut) exOut.appendChild(el("span", "err", String(e.message || e)));
    } finally {
      exRun.disabled = false;
      running = false;
    }
  };
  exRow.appendChild(exRun);
  exCard.appendChild(exRow);
  exCard.appendChild(exOut);
  root.appendChild(exCard);

  // Задание
  const taskCard = el("div", "card");
  taskCard.innerHTML = `<h2 class="sec">Задание</h2>`;
  const taskText = el("div", "theory");
  taskText.innerHTML = "<p>" + esc(L.task.text).replace(/\n/g, "<br>") + "</p>";
  taskCard.appendChild(taskText);

  // Редактор
  const editorWrap = el("div", "codewrap");
  const gutter = el("div", "gutter");
  const ta = document.createElement("textarea");
  ta.id = "editor";
  ta.spellcheck = false;
  ta.value = (state.code[L.id] !== undefined) ? state.code[L.id] : L.task.starter;
  editorWrap.appendChild(gutter);
  editorWrap.appendChild(ta);
  taskCard.appendChild(editorWrap);

  function updateGutter() {
    const lines = ta.value.split("\n").length;
    let out = "";
    for (let i = 1; i <= Math.max(lines, 1); i++) out += i + "\n";
    gutter.textContent = out;
  }
  function updateSize() {
    const lines = Math.max(ta.value.split("\n").length, 8);
    ta.style.height = (lines * 21.6 + 26) + "px";
  }
  updateGutter(); updateSize();
  ta.addEventListener("input", () => {
    updateGutter();
    updateSize();
    state.code[L.id] = ta.value;
    saveState();
  });
  ta.addEventListener("scroll", () => { gutter.scrollTop = ta.scrollTop; });
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      updateGutter(); updateSize();
      state.code[L.id] = ta.value; saveState();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      runBtn.click();
    }
  });
  currentEditor = ta;

  // Кнопки
  const row = el("div", "row");
  const runBtn = el("button", "btn primary run-btn", "▶ Запустить");
  const checkBtn = el("button", "btn ok", "✓ Проверить");
  const hintBtn = el("button", "btn ghost", "💡 Подсказка");
  const solBtn = el("button", "btn ghost", "👁 Решение");
  const resetBtn = el("button", "btn ghost", "↺ Сброс");
  runBtn.disabled = !pyReady; checkBtn.disabled = !pyReady;

  row.appendChild(runBtn);
  row.appendChild(checkBtn);
  row.appendChild(hintBtn);
  row.appendChild(solBtn);
  row.appendChild(resetBtn);
  taskCard.appendChild(row);

  // Консоль вывода
  const out = el("div", "console");
  out.innerHTML = '<span class="placeholder">Вывод программы появится здесь…</span>';
  taskCard.appendChild(out);

  // Вердикт
  const verdict = el("div", "verdict");
  taskCard.appendChild(verdict);

  root.appendChild(taskCard);

  /* --- Действия --- */
  function clearOut() { out.innerHTML = ""; }
  function showVerdict(ok, msg) {
    verdict.className = "verdict show " + (ok ? "good" : "bad");
    verdict.textContent = msg;
  }

  runBtn.onclick = async () => {
    if (running) return;
    running = true;
    verdict.className = "verdict";
    clearOut();
    runBtn.innerHTML = '<span class="loader"></span> Выполняется…';
    try {
      await executePython(ta.value, null, L.task.stdin, out);
      if (!out.textContent.trim()) {
        out.innerHTML = '<span class="placeholder">(программа ничего не вывела)</span>';
      }
    } catch (e) {
      out.appendChild(el("span", "err", String(e.message || e)));
    } finally {
      runBtn.innerHTML = "▶ Запустить";
      runBtn.disabled = false;
      running = false;
    }
  };

  checkBtn.onclick = async () => {
    if (running) return;
    running = true;
    verdict.className = "verdict";
    clearOut();
    checkBtn.innerHTML = '<span class="loader"></span> Проверка…';
    try {
      await executePython(ta.value, L.task.tests, L.task.stdin, out);
      state.completed[L.id] = true;
      saveState();
      renderSidebar();
      showVerdict(true, "🎉 Отлично! Все проверки пройдены. Урок засчитан.");
    } catch (e) {
      let msg = String(e.message || e);
      msg = msg.replace(/^PythonError:\s*/, "").replace(/^Traceback[\s\S]*?AssertionError:\s*/, "");
      showVerdict(false, "❌ Пока не всё верно:\n" + msg);
    } finally {
      checkBtn.innerHTML = "✓ Проверить";
      checkBtn.disabled = false;
      running = false;
    }
  };

  hintBtn.onclick = () => {
    showVerdict(true, "💡 Подсказка:\n" + L.task.hint);
    verdict.className = "verdict show good";
    verdict.style.background = "rgba(227,179,65,.12)";
    verdict.style.borderColor = "rgba(227,179,65,.45)";
    verdict.style.color = "#e3b341";
    setTimeout(() => { verdict.style.background = ""; verdict.style.borderColor = ""; verdict.style.color = ""; }, 6000);
  };

  solBtn.onclick = () => {
    if (!confirm("Показать решение? Постарайся сначала решить сам — так знания закрепляются лучше.")) return;
    ta.value = L.task.solution;
    state.code[L.id] = ta.value;
    saveState();
    updateGutter(); updateSize();
  };

  resetBtn.onclick = () => {
    ta.value = L.task.starter;
    state.code[L.id] = ta.value;
    saveState();
    updateGutter(); updateSize();
    verdict.className = "verdict";
    clearOut();
  };

  // Навигация
  const nav = el("div", "navbtns");
  const prev = el("button", "btn", "← Назад");
  const next = el("button", "btn primary", "Далее →");
  prev.disabled = state.current === 0;
  next.disabled = state.current === FLAT.length - 1;
  prev.onclick = () => goTo(state.current - 1);
  next.onclick = () => goTo(state.current + 1);
  nav.appendChild(prev);
  nav.appendChild(el("div", "spacer"));
  const pos = el("div", "", (state.current + 1) + " / " + FLAT.length);
  pos.style.cssText = "color:var(--muted);font-size:13px;align-self:center";
  nav.appendChild(pos);
  nav.appendChild(el("div", "spacer"));
  nav.appendChild(next);
  root.appendChild(nav);
}

/* ------- Модальное окно / сертификат ------- */
function closeModal() { $("#overlay").classList.remove("show"); }

$("#certBtn").onclick = () => {
  const total = FLAT.length;
  const done = Object.keys(state.completed).filter(k => state.completed[k]).length;
  const modal = $("#modal");
  modal.innerHTML = "";
  modal.appendChild(el("h3", "", "🏆 Сертификат OpenClaw"));

  if (done < total) {
    const p = el("p", "", `Пройдено ${done} из ${total} уроков. Заверши весь курс, чтобы получить сертификат.`);
    modal.appendChild(p);
  } else {
    const p = el("p", "", "Поздравляем! Ты прошёл полный курс Python от OpenClaw.");
    modal.appendChild(p);
    const cert = el("div", "cert");
    cert.appendChild(el("div", "seal", "🐍"));
    cert.appendChild(el("h4", "", "Сертификат о прохождении"));
    cert.appendChild(el("div", "sub", "Курс «Python с нуля до ООП»"));
    cert.appendChild(el("div", "sub", "OpenClaw Academy"));
    const student = el("div", "", "Студент: " + (localStorage.getItem("openclaw_name") || "________________________________"));
    student.style.cssText = "margin-top:18px;font-weight:700;font-size:15px";
    cert.appendChild(student);
    cert.appendChild(el("div", "sub", new Date().toLocaleDateString("ru-RU")));
    modal.appendChild(cert);

    const nameInput = document.createElement("input");
    nameInput.placeholder = "Твоё имя для сертификата";
    nameInput.value = localStorage.getItem("openclaw_name") || "";
    nameInput.style.cssText = "width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);margin-bottom:14px";
    nameInput.oninput = () => {
      localStorage.setItem("openclaw_name", nameInput.value);
      student.textContent = "Студент: " + (nameInput.value || "________________________________");
    };
    modal.insertBefore(nameInput, cert);
  }

  const close = el("button", "btn primary", "Закрыть");
  close.onclick = closeModal;
  modal.appendChild(close);
  $("#overlay").classList.add("show");
};

$("#overlay").onclick = e => { if (e.target.id === "overlay") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ------- Тема ------- */
function applyTheme() {
  document.body.classList.toggle("light", state.theme === "light");
  $("#themeBtn").textContent = state.theme === "light" ? "☀️" : "🌙";
}
$("#themeBtn").onclick = () => {
  state.theme = state.theme === "light" ? "dark" : "light";
  applyTheme();
  saveState();
};

/* ------- Сброс ------- */
$("#resetBtn").onclick = () => {
  if (!confirm("Сбросить весь прогресс и код? Это действие необратимо.")) return;
  state.completed = {};
  state.code = {};
  state.current = 0;
  saveState();
  renderSidebar();
  renderLesson();
  $("#content").scrollTop = 0;
};

/* ------- Мобильное меню ------- */
$("#burger").onclick = () => $("#sidebar").classList.toggle("open");
document.addEventListener("click", e => {
  const sb = $("#sidebar");
  if (window.innerWidth <= 980 && sb.classList.contains("open") &&
      !sb.contains(e.target) && e.target.id !== "burger") {
    sb.classList.remove("open");
  }
});

/* ------- Старт ------- */
loadState();
applyTheme();
if (state.current >= FLAT.length) state.current = 0;
renderSidebar();
renderLesson();
initPython();
</script>
