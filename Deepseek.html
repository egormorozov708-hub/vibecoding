<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonCamp — интерактивный курс Python</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a0e14;
    color: #e6edf3;
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
    border-bottom: 1px solid #30363d;
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    color: #58a6ff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo span { color: #f0883e; }
  .progress-bar {
    flex: 1;
    max-width: 300px;
    height: 10px;
    background: #21262d;
    border-radius: 5px;
    overflow: hidden;
    min-width: 150px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #58a6ff, #f0883e);
    transition: width 0.5s ease;
  }
  .progress-text { font-size: 0.85rem; color: #8b949e; white-space: nowrap; }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    max-width: 1400px;
    margin: 0 auto;
    min-height: calc(100vh - 72px);
  }
  @media (max-width: 850px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static !important; max-height: none !important; }
  }

  .sidebar {
    background: #0d1117;
    border-right: 1px solid #30363d;
    padding: 20px 0;
    position: sticky;
    top: 72px;
    max-height: calc(100vh - 72px);
    overflow-y: auto;
  }
  .sidebar h3 {
    padding: 0 20px 12px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b949e;
  }
  .module {
    margin-bottom: 4px;
  }
  .module-title {
    padding: 10px 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
    color: #c9d1d9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
  }
  .module-title:hover { background: #161b22; }
  .module-title .badge {
    font-size: 0.7rem;
    background: #21262d;
    padding: 2px 8px;
    border-radius: 10px;
    color: #8b949e;
  }
  .lesson-list { display: none; }
  .module.open .lesson-list { display: block; }
  .module-title .arrow { transition: transform 0.2s; font-size: 0.7rem; }
  .module.open .arrow { transform: rotate(90deg); }

  .lesson-item {
    padding: 8px 20px 8px 36px;
    cursor: pointer;
    font-size: 0.88rem;
    color: #8b949e;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    border-left: 2px solid transparent;
  }
  .lesson-item:hover { background: #161b22; color: #c9d1d9; }
  .lesson-item.active {
    background: #161b22;
    color: #58a6ff;
    border-left-color: #58a6ff;
  }
  .lesson-item .check {
    font-size: 0.75rem;
    color: #3fb950;
    margin-left: auto;
  }

  .content {
    padding: 32px 40px 80px;
    max-width: 900px;
  }
  @media (max-width: 850px) { .content { padding: 20px 16px 60px; } }

  .lesson-header h1 {
    font-size: 1.9rem;
    margin-bottom: 8px;
    color: #f0f6fc;
  }
  .lesson-header .subtitle {
    color: #8b949e;
    margin-bottom: 24px;
    font-size: 0.95rem;
  }
  .theory { margin-bottom: 28px; }
  .theory h2 {
    font-size: 1.3rem;
    margin: 24px 0 12px;
    color: #f0f6fc;
    border-bottom: 1px solid #21262d;
    padding-bottom: 6px;
  }
  .theory p { margin-bottom: 12px; color: #c9d1d9; }
  .theory ul, .theory ol { margin: 12px 0 12px 24px; color: #c9d1d9; }
  .theory li { margin-bottom: 6px; }
  .theory code {
    background: #21262d;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.9em;
    color: #f0883e;
  }
  .theory strong { color: #f0f6fc; }

  pre {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin: 16px 0;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  pre code { color: #e6edf3; }
  .keyword { color: #ff7b72; }
  .string { color: #a5d6ff; }
  .number { color: #79c0ff; }
  .comment { color: #8b949e; font-style: italic; }
  .func { color: #d2a8ff; }
  .builtin { color: #ffa657; }

  .task {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 24px;
    margin-top: 28px;
  }
  .task h3 {
    color: #58a6ff;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .task .task-desc { margin-bottom: 16px; color: #c9d1d9; }
  .task textarea {
    width: 100%;
    min-height: 90px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    padding: 12px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.9rem;
    resize: vertical;
  }
  .task textarea:focus {
    outline: none;
    border-color: #58a6ff;
    box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
  }
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .option {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.9rem;
  }
  .option:hover { border-color: #58a6ff; background: #1c2128; }
  .option.selected { border-color: #58a6ff; background: #1c2128; }
  .option.correct { border-color: #3fb950; background: rgba(63,185,80,0.1); }
  .option.wrong { border-color: #f85149; background: rgba(248,81,73,0.1); }

  .btn {
    background: #238636;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 12px;
  }
  .btn:hover { background: #2ea043; }
  .btn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
  .btn-secondary {
    background: #21262d;
    color: #c9d1d9;
    margin-left: 10px;
  }
  .btn-secondary:hover { background: #30363d; }

  .feedback {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.success {
    background: rgba(63,185,80,0.1);
    border: 1px solid #3fb950;
    color: #3fb950;
  }
  .feedback.error {
    background: rgba(248,81,73,0.1);
    border: 1px solid #f85149;
    color: #f85149;
  }
  .feedback.info {
    background: rgba(88,166,255,0.1);
    border: 1px solid #58a6ff;
    color: #58a6ff;
  }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid #21262d;
  }

  .hint {
    font-size: 0.85rem;
    color: #8b949e;
    margin-top: 8px;
    font-style: italic;
  }

  .success-banner {
    background: linear-gradient(135deg, #238636, #2ea043);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 24px;
    display: none;
  }
  .success-banner.show { display: block; }
  .success-banner h2 { color: white; margin-bottom: 6px; }
  .success-banner p { color: rgba(255,255,255,0.9); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }
</style>
</head>
<body>

<header>
  <div class="logo">🐍 Python<span>Camp</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0 уроков</div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<script>
/* ============================ КУРС ============================ */
const course = [
  {
    id: "m1",
    title: "Модуль 1. Основы",
    lessons: [
      {
        id: "l1",
        title: "Введение в Python",
        subtitle: "Что такое Python и зачем он нужен",
        theory: `
          <h2>Что такое Python?</h2>
          <p><strong>Python</strong> — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Он известен своим простым и читаемым синтаксисом.</p>
          <h2>Почему Python популярен?</h2>
          <ul>
            <li>Простой и понятный синтаксис — код читается как английский текст</li>
            <li>Огромная экосистема библиотек</li>
            <li>Используется в веб-разработке, Data Science, машинном обучении, автоматизации</li>
            <li>Кроссплатформенность</li>
          </ul>
          <h2>Первая программа</h2>
          <p>Традиционно изучение языка начинается с программы, выводящей приветствие:</p>
          <pre><code><span class="builtin">print</span>(<span class="string">"Hello, World!"</span>)</code></pre>
          <p>Функция <code>print()</code> выводит текст на экран. Строки заключаются в кавычки.</p>
        `,
        task: {
          type: "quiz",
          question: "Какая функция выводит текст на экран в Python?",
          options: ["echo()", "print()", "console.log()", "write()"],
          correct: 1,
          hint: "Эта функция встречается в первой программе каждого Python-разработчика."
        }
      },
      {
        id: "l2",
        title: "Переменные и типы данных",
        subtitle: "Хранение и обработка информации",
        theory: `
          <h2>Переменные</h2>
          <p><strong>Переменная</strong> — это именованная область памяти для хранения данных. В Python не нужно указывать тип при объявлении:</p>
          <pre><code>name = <span class="string">"Анна"</span>
age = <span class="number">25</span>
height = <span class="number">1.75</span>
is_student = <span class="keyword">True</span></code></pre>
          <h2>Основные типы данных</h2>
          <ul>
            <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code></li>
            <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
            <li><code>str</code> — строки: <code>"привет"</code>, <code>'Python'</code></li>
            <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
          </ul>
          <h2>Проверка типа</h2>
          <pre><code><span class="builtin">print</span>(<span class="builtin">type</span>(<span class="number">42</span>))        <span class="comment"># &lt;class 'int'&gt;</span>
<span class="builtin">print</span>(<span class="builtin">type</span>(<span class="string">"hello"</span>))   <span class="comment"># &lt;class 'str'&gt;</span></code></pre>
          <h2>Преобразование типов</h2>
          <pre><code>x = <span class="builtin">int</span>(<span class="string">"10"</span>)     <span class="comment"># 10</span>
y = <span class="builtin">str</span>(<span class="number">3.14</span>)     <span class="comment"># "3.14"</span>
z = <span class="builtin">float</span>(<span class="string">"2.5"</span>)   <span class="comment"># 2.5</span></code></pre>
        `,
        task: {
          type: "code",
          question: "Создайте переменную <code>x</code> со значением <code>10</code> и переменную <code>name</code> со значением <code>\"Python\"</code>.",
          check: (code) => {
            const cleaned = code.replace(/\s/g, '');
            return cleaned.includes('x=10') && (cleaned.includes('name="Python"') || cleaned.includes("name='Python'"));
          },
          hint: "Используйте синтаксис: x = 10",
          solution: 'x = 10\nname = "Python"'
        }
      },
      {
        id: "l3",
        title: "Операторы",
        subtitle: "Арифметические и логические операции",
        theory: `
          <h2>Арифметические операторы</h2>
          <pre><code>a = <span class="number">10</span>
b = <span class="number">3</span>
<span class="builtin">print</span>(a + b)   <span class="comment"># 13 — сложение</span>
<span class="builtin">print</span>(a - b)   <span class="comment"># 7  — вычитание</span>
<span class="builtin">print</span>(a * b)   <span class="comment"># 30 — умножение</span>
<span class="builtin">print</span>(a / b)   <span class="comment"># 3.33 — деление</span>
<span class="builtin">print</span>(a // b)  <span class="comment"># 3  — целочисленное деление</span>
<span class="builtin">print</span>(a % b)   <span class="comment"># 1  — остаток</span>
<span class="builtin">print</span>(a ** b)  <span class="comment"># 1000 — возведение в степень</span></code></pre>
          <h2>Операторы сравнения</h2>
          <ul>
            <li><code>==</code> — равно</li>
            <li><code>!=</code> — не равно</li>
            <li><code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code> — больше/меньше</li>
          </ul>
          <h2>Логические операторы</h2>
          <pre><code><span class="keyword">and</span>  <span class="comment"># логическое И</span>
<span class="keyword">or</span>   <span class="comment"># логическое ИЛИ</span>
<span class="keyword">not</span>  <span class="comment"># логическое НЕ</span></code></pre>
        `,
        task: {
          type: "quiz",
          question: "Что вернёт выражение <code>17 % 5</code>?",
          options: ["3", "2", "3.4", "0"],
          correct: 1,
          hint: "% — это остаток от деления. 17 = 5*3 + 2."
        }
      },
    ]
  },
  {
    id: "m2",
    title: "Модуль 2. Управление потоком",
    lessons: [
      {
        id: "l4",
        title: "Условные операторы",
        subtitle: "if, elif, else",
        theory: `
          <h2>Конструкция if</h2>
          <p>Позволяет выполнять код в зависимости от условия:</p>
          <pre><code>age = <span class="number">18</span>
<span class="keyword">if</span> age >= <span class="number">18</span>:
    <span class="builtin">print</span>(<span class="string">"Совершеннолетний"</span>)
<span class="keyword">else</span>:
    <span class="builtin">print</span>(<span class="string">"Несовершеннолетний"</span>)</code></pre>
          <h2>elif</h2>
          <p>Позволяет проверить несколько условий:</p>
          <pre><code>score = <span class="number">85</span>
<span class="keyword">if</span> score >= <span class="number">90</span>:
    grade = <span class="string">"A"</span>
<span class="keyword">elif</span> score >= <span class="number">80</span>:
    grade = <span class="string">"B"</span>
<span class="keyword">elif</span> score >= <span class="number">70</span>:
    grade = <span class="string">"C"</span>
<span class="keyword">else</span>:
    grade = <span class="string">"F"</span></code></pre>
          <h2>Важно!</h2>
          <p>В Python отступы (обычно 4 пробела) определяют блоки кода. Это не просто стиль, а синтаксис языка.</p>
        `,
        task: {
          type: "code",
          question: "Напишите код: если переменная <code>n</code> больше 0, выведите <code>\"positive\"</code>, иначе <code>\"negative\"</code>.",
          check: (code) => {
            const c = code.replace(/\s+/g, ' ');
            return /if\s+n\s*>\s*0\s*:/.test(c) && /print\s*\(\s*["']positive["']\s*\)/.test(c)
                && /else\s*:/.test(c) && /print\s*\(\s*["']negative["']\s*\)/.test(c);
          },
          hint: "Не забудьте двоеточие после условия и отступы.",
          solution: 'if n > 0:\n    print("positive")\nelse:\n    print("negative")'
        }
      },
      {
        id: "l5",
        title: "Циклы while и for",
        subtitle: "Повторение действий",
        theory: `
          <h2>Цикл while</h2>
          <p>Выполняется, пока условие истинно:</p>
          <pre><code>i = <span class="number">1</span>
<span class="keyword">while</span> i <= <span class="number">5</span>:
    <span class="builtin">print</span>(i)
    i += <span class="number">1</span></code></pre>
          <h2>Цикл for</h2>
          <p>Итерируется по последовательности:</p>
          <pre><code><span class="keyword">for</span> i <span class="keyword">in</span> <span class="builtin">range</span>(<span class="number">1</span>, <span class="number">6</span>):
    <span class="builtin">print</span>(i)

fruits = [<span class="string">"яблоко"</span>, <span class="string">"банан"</span>, <span class="string">"вишня"</span>]
<span class="keyword">for</span> fruit <span class="keyword">in</span> fruits:
    <span class="builtin">print</span>(fruit)</code></pre>
          <h2>range()</h2>
          <ul>
            <li><code>range(5)</code> — 0,1,2,3,4</li>
            <li><code>range(1, 5)</code> — 1,2,3,4</li>
            <li><code>range(0, 10, 2)</code> — 0,2,4,6,8</li>
          </ul>
          <h2>break и continue</h2>
          <pre><code><span class="keyword">for</span> i <span class="keyword">in</span> <span class="builtin">range</span>(<span class="number">10</span>):
    <span class="keyword">if</span> i == <span class="number">5</span>:
        <span class="keyword">break</span>      <span class="comment"># выход из цикла</span>
    <span class="keyword">if</span> i % <span class="number">2</span> == <span class="number">0</span>:
        <span class="keyword">continue</span>   <span class="comment"># пропустить итерацию</span>
    <span class="builtin">print</span>(i)</code></pre>
        `,
        task: {
          type: "quiz",
          question: "Сколько раз выполнится тело цикла <code>for i in range(3):</code>?",
          options: ["2 раза", "3 раза", "4 раза", "бесконечно"],
          correct: 1,
          hint: "range(3) генерирует числа 0, 1, 2."
        }
      },
      {
        id: "l6",
        title: "Функции",
        subtitle: "Повторное использование кода",
        theory: `
          <h2>Определение функции</h2>
          <pre><code><span class="keyword">def</span> <span class="func">greet</span>(name):
    <span class="keyword">return</span> <span class="string">f"Привет, {name}!"</span>

message = greet(<span class="string">"Анна"</span>)
<span class="builtin">print</span>(message)  <span class="comment"># Привет, Анна!</span></code></pre>
          <h2>Параметры и аргументы</h2>
          <pre><code><span class="keyword">def</span> <span class="func">add</span>(a, b):
    <span class="keyword">return</span> a + b

<span class="builtin">print</span>(add(<span class="number">2</span>, <span class="number">3</span>))  <span class="comment"># 5</span></code></pre>
          <h2>Значения по умолчанию</h2>
          <pre><code><span class="keyword">def</span> <span class="func">power</span>(base, exp=<span class="number">2</span>):
    <span class="keyword">return</span> base ** exp

<span class="builtin">print</span>(power(<span class="number">3</span>))     <span class="comment"># 9</span>
<span class="builtin">print</span>(power(<span class="number">2</span>, <span class="number">3</span>))  <span class="comment"># 8</span></code></pre>
          <h2>Возврат значений</h2>
          <p><code>return</code> возвращает результат и завершает функцию. Без <code>return</code> функция возвращает <code>None</code>.</p>
        `,
        task: {
          type: "code",
          question: "Напишите функцию <code>square(n)</code>, которая возвращает квадрат числа n.",
          check: (code) => {
            const c = code.replace(/\s+/g, ' ');
            return /def\s+square\s*\(\s*n\s*\)\s*:/.test(c) && /return\s+n\s*\*\s*n/.test(c);
          },
          hint: "Квадрат числа — это число, умноженное на само себя.",
          solution: 'def square(n):\n    return n * n'
        }
      },
    ]

/* ============================ СОСТОЯНИЕ ============================ */
let completed = JSON.parse(localStorage.getItem('pythoncamp_completed') || '{}');
let currentLessonId = localStorage.getItem('pythoncamp_current') || 'l1';

function save() {
  localStorage.setItem('pythoncamp_completed', JSON.stringify(completed));
  localStorage.setItem('pythoncamp_current', currentLessonId);
  updateProgress();
}

function allLessons() {
  const arr = [];
  course.forEach(m => m.lessons.forEach(l => arr.push(l)));
  return arr;
}

function updateProgress() {
  const total = allLessons().length;
  const done = Object.values(completed).filter(Boolean).length;
  const pct = total ? (done / total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} уроков`;
}

/* ============================ SIDEBAR ============================ */
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '<h3>Курс Python</h3>';
  course.forEach(mod => {
    const modDone = mod.lessons.every(l => completed[l.id]);
    const open = mod.lessons.some(l => l.id === currentLessonId);
    html += `<div class="module ${open ? 'open' : ''}">`;
    html += `<div class="module-title" onclick="toggleModule(this)">
      <span>${mod.title}</span>
      <span><span class="badge">${mod.lessons.length}</span> <span class="arrow">▶</span></span>
    </div>`;
    html += '<div class="lesson-list">';
    mod.lessons.forEach(l => {
      html += `<div class="lesson-item ${l.id === currentLessonId ? 'active' : ''}" onclick="goTo('${l.id}')">
        ${l.title}
        ${completed[l.id] ? '<span class="check">✓</span>' : ''}
      </div>`;
    });
    html += '</div></div>';
  });
  sidebar.innerHTML = html;
}

function toggleModule(el) {
  el.parentElement.classList.toggle('open');
}

function goTo(id) {
  currentLessonId = id;
  save();
  renderSidebar();
  renderLesson();
  window.scrollTo(0, 0);
}

/* ============================ LESSON ============================ */
function renderLesson() {
  const lesson = allLessons().find(l => l.id === currentLessonId) || allLessons()[0];
  const content = document.getElementById('content');

  const isDone = completed[lesson.id];
  const idx = allLessons().findIndex(l => l.id === lesson.id);
  const prev = idx > 0 ? allLessons()[idx - 1] : null;
  const next = idx < allLessons().length - 1 ? allLessons()[idx + 1] : null;

  let html = `
    <div class="success-banner ${isDone ? 'show' : ''}" id="successBanner">
      <h2>🎉 Урок завершён!</h2>
      <p>Отличная работа. Продолжайте в том же духе!</p>
    </div>
    <div class="lesson-header">
      <h1>${lesson.title}</h1>
      <div class="subtitle">${lesson.subtitle}</div>
    </div>
    <div class="theory">${lesson.theory}</div>
    <div class="task" id="taskBox">
      <h3>📝 Задание</h3>
      <div class="task-desc">${lesson.task.question}</div>
      <div id="taskArea"></div>
      <div class="feedback" id="feedback"></div>
      <div class="hint" id="hint" style="display:none"></div>
      <div style="margin-top:12px;">
        <button class="btn" id="checkBtn">Проверить</button>
        <button class="btn btn-secondary" id="hintBtn">Подсказка</button>
        <button class="btn btn-secondary" id="resetBtn">Сброс</button>
      </div>
    </div>
    <div class="nav-buttons">
      ${prev ? `<button class="btn btn-secondary" onclick="goTo('${prev.id}')">← ${prev.title}</button>` : '<span></span>'}
      ${next ? `<button class="btn" onclick="goTo('${next.id}')">${next.title} →</button>` : '<span></span>'}
    </div>
  `;
  content.innerHTML = html;

  // Отрисовка задания
  const taskArea = document.getElementById('taskArea');
  if (lesson.task.type === 'quiz') {
    taskArea.innerHTML = '<div class="options" id="options"></div>';
    const opts = document.getElementById('options');
    lesson.task.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.textContent = opt;
      div.dataset.index = i;
      div.onclick = () => {
        if (document.querySelector('.option.correct') || document.querySelector('.option.wrong')) return;
        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        div.classList.add('selected');
      };
      opts.appendChild(div);
    });
  } else {
    taskArea.innerHTML = `<textarea id="codeInput" placeholder="Введите код..."></textarea>`;
  }

  // Если урок пройден — показываем решение
  if (isDone) {
    showSolved(lesson);
  }

  // Кнопки
  document.getElementById('checkBtn').onclick = () => checkTask(lesson);
  document.getElementById('hintBtn').onclick = () => {
    const h = document.getElementById('hint');
    h.style.display = 'block';
    h.textContent = '💡 ' + lesson.task.hint;
  };
  document.getElementById('resetBtn').onclick = () => resetTask(lesson);
}

function showSolved(lesson) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback success show';
  fb.textContent = '✓ Урок уже пройден. Решение:';
  fb.innerHTML += `<pre style="margin-top:10px;"><code>${escapeHtml(lesson.task.type === 'code' ? lesson.task.solution : lesson.task.options[lesson.task.correct])}</code></pre>`;
  document.getElementById('checkBtn').disabled = true;
  if (lesson.task.type === 'quiz') {
    document.querySelectorAll('.option').forEach((o, i) => {
      if (i === lesson.task.correct) o.classList.add('correct');
    });
  }
}

function resetTask(lesson) {
  completed[lesson.id] = false;
  save();
  renderSidebar();
  renderLesson();
}

function checkTask(lesson) {
  const fb = document.getElementById('feedback');
  const task = lesson.task;
  let correct = false;

  if (task.type === 'quiz') {
    const selected = document.querySelector('.option.selected');
    if (!selected) {
      fb.className = 'feedback error show';
      fb.textContent = 'Выберите один из вариантов.';
      return;
    }
    const idx = parseInt(selected.dataset.index);
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    if (idx === task.correct) {
      selected.classList.add('correct');
      correct = true;
    } else {
      selected.classList.add('wrong');
      document.querySelectorAll('.option')[task.correct].classList.add('correct');
    }
  } else {
    const code = document.getElementById('codeInput').value;
    if (!code.trim()) {
      fb.className = 'feedback error show';
      fb.textContent = 'Введите код.';
      return;
    }
    try {
      correct = task.check(code);
    } catch (e) {
      correct = false;
    }
  }

  if (correct) {
    fb.className = 'feedback success show';
    fb.textContent = '✓ Верно! Отличная работа.';
    completed[lesson.id] = true;
    save();
    renderSidebar();
    document.getElementById('successBanner').classList.add('show');
    document.getElementById('checkBtn').disabled = true;
    if (task.type === 'code') {
      fb.innerHTML += `<pre style="margin-top:10px;"><code>${escapeHtml(task.solution)}</code></pre>`;
    }
  } else {
    fb.className = 'feedback error show';
    fb.textContent = '✗ Не совсем. Попробуйте ещё раз или посмотрите подсказку.';
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

updateProgress();
